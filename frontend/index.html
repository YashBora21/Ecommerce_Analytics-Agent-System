<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecommerce Analytics</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Welcome Analyst</p>
        <h1>Ecommerce Analytics</h1>
        <p>Ask questions, calculate statistics, and create charts from the database.</p>
      </div>
      <span id="status" class="status">Checking API…</span>
    </header>
    <section id="messages" class="messages" aria-live="polite">
      <article class="message assistant">
        <div class="bubble">Try “Which month had the highest sales?” or ask for a chart.</div>
      </article>
    </section>
    <section class="examples" aria-label="Example questions">
      <button type="button">Show monthly revenue as a line chart</button>
      <button type="button">Which categories have the highest sales?</button>
      <button type="button">What is the median delivery time?</button>
    </section>
    <form id="question-form">
      <label for="question">Question</label>
      <div class="composer">
        <textarea id="question" rows="2" placeholder="Ask about orders, revenue, delivery, reviews…"
          required></textarea>
        <button id="send" type="submit">Ask</button>
      </div>
    </form>
  </main>
  <script src="app.js"></script>
</body>

</html>
